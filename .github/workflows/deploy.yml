name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create the Pages project if it does not exist yet
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d3aefe8ad2b7a8399b3f47238cde9599
          command: pages project create puzzle-parlor-app --production-branch=main
        continue-on-error: true
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d3aefe8ad2b7a8399b3f47238cde9599
          command: pages deploy --project-name=puzzle-parlor-app --branch=main --commit-dirty=true
