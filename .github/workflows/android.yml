name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor and copy the web app into the Android project
        run: |
          npm ci
          npx cap sync android

      - name: Restore the upload keystore from secrets (release signing)
        if: ${{ env.KS != '' }}
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > android/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' "$KS_PASSWORD" "$KS_PASSWORD" > android/keystore.properties

      - name: Build release bundle and debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleDebug

      - name: Verify the bundle is signed
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: puzzle-parlor-android
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
